name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://dev:dev@127.0.0.1:5432/intel_ci
  TEST_DATABASE_URL: postgresql://dev:dev@127.0.0.1:5432/spiderweb_test
  NEXT_PUBLIC_API_URL: http://localhost:3001

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: intel_ci
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dev -d intel_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec prettier --check .

      # Integration tests create and migrate their own spiderweb_test database.
      - run: pnpm test

      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: intel_ci
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dev -d intel_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate

      - name: Install Playwright browser
        run: pnpm --filter @intel/e2e exec playwright install --with-deps chromium

      - name: Run end-to-end suite
        run: pnpm test:e2e
        env:
          # Ingestion runs in the API process, so no worker is needed.
          INGESTION_MODE: inline

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
